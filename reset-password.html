<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Zantray</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FFF8F0; color: #2D1B00; }
    header { background: #FF6B35; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-size: 24px; font-weight: 900; color: #fff; text-decoration: none; }
    .logo span { color: #FFD600; }
    .container { max-width: 480px; margin: 60px auto; padding: 0 24px; }
    .card { background: #fff; border-radius: 20px; padding: 40px; border: 1px solid #F0D5B8; }
    .icon { font-size: 48px; text-align: center; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 900; color: #2D1B00; margin-bottom: 8px; text-align: center; }
    p { font-size: 14px; color: #C4956A; text-align: center; margin-bottom: 24px; }
    label { font-size: 12px; font-weight: 600; color: #C4956A; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    input { width: 100%; background: #FFF8F0; border: 1.5px solid #F0D5B8; border-radius: 12px; padding: 14px 16px; font-size: 15px; color: #2D1B00; outline: none; margin-bottom: 16px; }
    input:focus { border-color: #FF6B35; }
    button { width: 100%; background: #FF6B35; color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #e55a25; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #FF4444; font-size: 13px; text-align: center; margin-top: 12px; }
    .success { color: #4CAF50; font-size: 13px; text-align: center; margin-top: 12px; }
    footer { text-align: center; margin-top: 40px; color: #C4956A; font-size: 13px; }
    footer a { color: #FF6B35; text-decoration: none; }
  </style>
</head>
<body>
<header>
  <a href="index.html" class="logo">Zan<span>tray</span></a>
</header>
<div class="container">
  <div class="card">
    <div class="icon">🔐</div>
    <h1>Reset Your Password</h1>
    <p>Enter your new password below</p>
    <label>NEW PASSWORD</label>
    <input type="password" id="password" placeholder="Min. 6 characters" />
    <label>CONFIRM PASSWORD</label>
    <input type="password" id="confirmPassword" placeholder="Repeat your password" />
    <button onclick="resetPassword()" id="btn">Reset Password</button>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>
</div>
<footer>
  <p>© 2026 Zantray · <a href="index.html">Home</a> · <a href="privacy.html">Privacy Policy</a></p>
</footer>
<script>
  const BACKEND = 'https://zantray-backend.onrender.com';
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    document.getElementById('error').textContent = 'Invalid reset link. Please request a new one.';
    document.getElementById('btn').disabled = true;
  }

  async function resetPassword() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const btn = document.getElementById('btn');

    errorEl.textContent = '';
    successEl.textContent = '';

    if (!password) { errorEl.textContent = 'Please enter a new password'; return; }
    if (password.length < 6) { errorEl.textContent = 'Password must be at least 6 characters'; return; }
    if (password !== confirmPassword) { errorEl.textContent = 'Passwords do not match'; return; }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      const res = await fetch(`${BACKEND}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password })
      });
      const data = await res.json();
      if (data.success) {
        successEl.textContent = '✅ Password reset successfully! You can now log in with your new password.';
        btn.textContent = 'Done!';
      } else {
        errorEl.textContent = data.error || 'Could not reset password';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    } catch (err) {
      errorEl.textContent = 'Could not connect to server';
      btn.disabled = false;
      btn.textContent = 'Reset Password';
    }
  }
</script>
</body>
</html>
